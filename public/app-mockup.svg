<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640" role="img" aria-label="FinTrack on iPhone">
  <!-- Phone frame -->
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fafaf9"/>
      <stop offset="1" stop-color="#f1f1ee"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#0f0f12"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="304" height="624" rx="48" fill="url(#frame)"/>
  <rect x="16" y="16" width="288" height="608" rx="42" fill="url(#bg)"/>

  <!-- Notch -->
  <rect x="124" y="22" width="72" height="20" rx="10" fill="#0f0f12"/>

  <!-- Status bar -->
  <text x="36" y="62" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#18181b">9:41</text>

  <!-- Header -->
  <text x="36" y="100" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#18181b">FinTrack</text>
  <text x="36" y="120" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#71717a">June</text>

  <!-- Balance card -->
  <rect x="28" y="138" width="264" height="92" rx="18" fill="#007AFF"/>
  <text x="44" y="166" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#cfe1ff">Balance</text>
  <text x="44" y="196" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff">$2,418.40</text>
  <text x="44" y="214" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#cfe1ff">+$312.00 this week</text>

  <!-- Section header -->
  <text x="36" y="262" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#52525b">RECENT</text>

  <!-- Transaction rows -->
  <g font-family="-apple-system, system-ui, sans-serif">
    <!-- row 1 -->
    <circle cx="48" cy="298" r="14" fill="#fee2e2"/>
    <text x="48" y="302" text-anchor="middle" font-size="13" fill="#b91c1c">☕</text>
    <text x="74" y="294" font-size="13" font-weight="600" fill="#18181b">Coffee</text>
    <text x="74" y="310" font-size="10" fill="#71717a">Today · Food</text>
    <text x="284" y="302" text-anchor="end" font-size="13" font-weight="600" fill="#b91c1c">−$4.20</text>

    <!-- row 2 -->
    <circle cx="48" cy="338" r="14" fill="#dcfce7"/>
    <text x="48" y="342" text-anchor="middle" font-size="12" fill="#15803d">$</text>
    <text x="74" y="334" font-size="13" font-weight="600" fill="#18181b">Salary</text>
    <text x="74" y="350" font-size="10" fill="#71717a">Mon · Income</text>
    <text x="284" y="342" text-anchor="end" font-size="13" font-weight="600" fill="#15803d">+$2,200</text>

    <!-- row 3 -->
    <circle cx="48" cy="378" r="14" fill="#e0e7ff"/>
    <text x="48" y="382" text-anchor="middle" font-size="12" fill="#4338ca">↑</text>
    <text x="74" y="374" font-size="13" font-weight="600" fill="#18181b">Lent to Alex</text>
    <text x="74" y="390" font-size="10" fill="#71717a">Sun · Loan</text>
    <text x="284" y="382" text-anchor="end" font-size="13" font-weight="600" fill="#4338ca">−$120</text>

    <!-- row 4 -->
    <circle cx="48" cy="418" r="14" fill="#fef3c7"/>
    <text x="48" y="422" text-anchor="middle" font-size="12" fill="#b45309">🛒</text>
    <text x="74" y="414" font-size="13" font-weight="600" fill="#18181b">Groceries</text>
    <text x="74" y="430" font-size="10" fill="#71717a">Sat · Food</text>
    <text x="284" y="422" text-anchor="end" font-size="13" font-weight="600" fill="#b45309">−$54.10</text>

    <!-- row 5 -->
    <circle cx="48" cy="458" r="14" fill="#cffafe"/>
    <text x="48" y="462" text-anchor="middle" font-size="12" fill="#0e7490">🚇</text>
    <text x="74" y="454" font-size="13" font-weight="600" fill="#18181b">Transit</text>
    <text x="74" y="470" font-size="10" fill="#71717a">Sat · Travel</text>
    <text x="284" y="462" text-anchor="end" font-size="13" font-weight="600" fill="#0e7490">−$2.75</text>
  </g>

  <!-- Tab bar -->
  <rect x="28" y="544" width="264" height="60" rx="20" fill="#ffffff" stroke="#e7e5e4"/>
  <g font-family="-apple-system, system-ui, sans-serif" font-size="10" text-anchor="middle">
    <text x="84" y="580" fill="#007AFF" font-weight="700">●</text>
    <text x="84" y="595" fill="#007AFF" font-weight="600">Home</text>
    <text x="160" y="582" fill="#71717a">○</text>
    <text x="160" y="595" fill="#71717a">Stats</text>
    <text x="236" y="582" fill="#71717a">○</text>
    <text x="236" y="595" fill="#71717a">Settings</text>
  </g>
</svg>
